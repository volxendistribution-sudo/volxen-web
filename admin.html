<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">

<title>VOLXEN · Panel</title>

<style>
@font-face{font-family:'DM Sans';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/DM-Sans-Regular.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/DM-Sans-SemiBold.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/DM-Sans-Bold.woff2') format('woff2')}
@font-face{font-family:'Inter Tight';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/InterTight-Regular.woff2') format('woff2')}
@font-face{font-family:'Inter Tight';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/InterTight-SemiBold.woff2') format('woff2')}

:root{
--bg:#F7F2E8;--sf:#EEE5D6;--s2:#FFFCF6;--fg:#171410;--mu:#5A5449;
--bd:#DFD3C0;--g:#C8A165;--gi:#6E5327;--pf:#1F4036;--ox:#A64B30;--ox-hover:#8A3D26;
--d:'DM Sans',system-ui,sans-serif;--s:'Inter Tight',system-ui,sans-serif;
--shadow-sm:0 1px 2px rgba(18,16,12,.04);
--radius-field:12px;--radius-card:24px;--radius-pill:999px;--control-h:48px
}

*{box-sizing:border-box}

body{
font:400 14px/1.6 var(--s);
margin:0;
background:var(--bg);
color:var(--fg)
}

header{
background:var(--pf);
color:var(--s2);
padding:20px 16px;
font:700 14px/1.4 var(--d);
letter-spacing:.18em;
text-transform:uppercase
}

main{
padding:16px;
max-width:720px;
margin:auto
}

h1,h2,h3,h4{font-family:var(--d);margin:20px 0 8px;line-height:1.3}
h1{font-size:24px}
h2,h3{font-size:16px}
h4{font-size:14px}
p{margin:8px 0}

input,select,textarea{
width:100%;
min-height:var(--control-h);
padding:12px 16px;
margin:8px 0;
font:400 16px var(--s);
border:1px solid var(--bd);
border-radius:var(--radius-field);
background:var(--s2);
color:var(--fg);
box-sizing:border-box
}

textarea{min-height:96px;padding-top:12px;resize:vertical}

input:focus,select:focus,textarea:focus{
outline:none;
border-color:var(--gi);
box-shadow:0 0 0 3px rgba(110,83,39,.24)
}

button{
width:100%;
min-height:var(--control-h);
padding:12px 18px;
margin:8px 0;
font:600 14px var(--s);
border:1px solid transparent;
border-radius:var(--radius-pill);
background:var(--pf);
color:var(--s2);
cursor:pointer;
transition:background .2s,border-color .2s,color .2s
}

button:hover{background:var(--g);border-color:var(--g);color:var(--fg)}
button:active{transform:translateY(1px)}

.t{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.t button{flex:1;min-width:110px;background:var(--s2);color:var(--fg);border-color:var(--bd)}
.t button:hover{background:var(--g);border-color:var(--g)}

.r{
background:var(--s2);
padding:16px;
margin:12px 0;
border:1px solid var(--bd);
border-radius:var(--radius-card);
box-shadow:var(--shadow-sm)
}

.r button{
width:auto;
min-height:44px;
padding:8px 14px;
margin:8px 6px 0 0;
font-size:12px
}

.x{background:var(--ox)!important;border-color:var(--ox)!important;color:#fff}
.x:hover{background:var(--ox-hover)!important;border-color:var(--ox-hover)!important}

.back{background:var(--s2);color:var(--fg);border-color:var(--bd)}
.back:hover{background:var(--sf);border-color:var(--bd);color:var(--fg)}

.estado{font-weight:600}

small{font-size:12px;line-height:1.5;color:var(--mu)}

#lg{background:var(--s2);border:1px solid var(--bd);border-radius:var(--radius-card);padding:24px;margin-top:24px}

#ms{min-height:20px;color:var(--ox)}

#dlg{
width:340px;
max-width:calc(100vw - 32px);
padding:24px;
border:1px solid var(--bd);
border-radius:var(--radius-card);
background:var(--s2);
color:var(--fg);
box-shadow:0 20px 40px -12px rgba(18,16,12,.35)
}

#dlg::backdrop{background:rgba(18,16,12,.55)}
#dlg h3{margin-top:0}
#dlg p{color:var(--mu)}
.dlg-a{display:flex;gap:8px;margin-top:8px}
.dlg-a button{flex:1}


#dlg{text-align:center}
.dlg-ico{
width:48px;height:48px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
border-radius:16px;background:rgba(31,64,54,.09);color:var(--pf)
}
.dlg-ico svg{width:26px;height:26px}
.dlg-a button:disabled{opacity:.55;cursor:not-allowed}
.admin-form{max-width:560px;margin:16px auto 24px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--radius-card);box-shadow:var(--shadow-sm);padding:24px}
.admin-form h3{text-align:center;font-size:24px;margin:0 0 8px}
.admin-form .form-intro{text-align:center;color:var(--mu);margin:0 auto 16px;max-width:34rem}
.admin-form label{display:block;font:700 14px/1.3 var(--d);margin:14px 0 6px;color:var(--fg)}
.admin-form input,.admin-form select,.admin-form textarea{background:var(--sf);border-color:transparent;margin:0}
.admin-form textarea{min-height:120px}
.admin-form .check{display:flex;align-items:center;gap:10px;margin-top:12px}
.admin-form .check input{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--pf)}
.admin-form .check label{margin:0;font:600 14px/1.3 var(--s)}
.form-actions{display:flex;gap:12px;margin-top:20px}
.form-actions button{flex:1;margin:0;min-height:var(--control-h);border-radius:var(--radius-pill)}
.op-row-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.op-badge{display:inline-block;padding:2px 8px;border-radius:var(--radius-pill);background:var(--sf);color:var(--mu);font:600 12px/1.6 var(--s)}
.op-badge.on{background:rgba(31,64,54,.1);color:var(--pf)}
.op-badge.off{background:rgba(166,75,48,.1);color:var(--ox)}
.op-meta{display:block;color:var(--mu);font-size:12px;line-height:1.6;margin-top:4px}
</style>
</head>

<body>

<header>
VOLXEN · PANEL
</header>

<main>

<!-- LOGIN -->

<div id="lg">

<h3>Iniciar sesión</h3>

<input
id="em"
type="email"
placeholder="Correo"
autocomplete="username"
>

<input
id="pw"
type="password"
placeholder="Contraseña"
autocomplete="current-password"
>

<button onclick="login()">
ENTRAR
</button>

<p id="loginmsg"></p>

</div>


<!-- PANEL ADMIN -->

<div id="ad" style="display:none">

<div class="t">

<button onclick="tab('p')">
Productos
</button>

<button onclick="tab('c')">
Categorías
</button>

<button onclick="tab('o')">
Ofertas
</button>

<button onclick="tab('w')">
Operadoras
</button>

<button onclick="tab('d')">
Pedidos
</button>

</div>

<p id="ms"></p>

<div id="v"></div>

</div>

</main>


<dialog id="dlg" aria-labelledby="dlgt" aria-describedby="dlgm">
<div class="dlg-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.7 2.4 17a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div>
<h3 id="dlgt">Confirmar eliminación</h3>
<p id="dlgm"></p>
<div class="dlg-a">
<button type="button" class="back" id="dlgc">Cancelar</button>
<button type="button" class="x" id="dlgo">Eliminar</button>
</div>
</dialog>

<script src="config.js"></script>

<script>

/* =========================
   CONFIGURACIÓN
========================= */

const C = window.VOLXEN_CONFIG;

const B = C.SUPABASE_URL;

let T = "";

let K = [];
let P = [];
let O = [];
let D = [];

let E = null;
let IM = [];
let OD = null;
let OP = [];
let OPEDIT = null;


/* =========================
   UTILIDADES
========================= */

const $ = i => document.getElementById(i);

/* =========================
   MODAL DE CONFIRMACIÓN
========================= */

let dlgResolver = null;
let dlgTask = null;

function dlgBusy(b){
const a = $("dlgc"), o = $("dlgo");
if(a) a.disabled = !!b;
if(o) o.disabled = !!b;
}

function dlgCerrar(valor){

const d = $("dlg");
const o = $("dlgo");

if(valor === false && o && o.disabled) return;

if(d && d.open){
d.close();
}

dlgBusy(false);
dlgTask = null;

if(dlgResolver){
const r = dlgResolver;
dlgResolver = null;
r(valor);
}

}

function askDelete(texto){
return askDeleteCon(texto, "Confirmar eliminación");
}

function askDeleteCon(texto, titulo, tarea){

const d = $("dlg");
const m = $("dlgm");
const t = $("dlgt");

if(!d || typeof d.showModal !== "function"){
return Promise.resolve(window.confirm(texto)).then(ok => ok && typeof tarea === "function" ? tarea() : ok);
}

m.textContent = texto;
if(t) t.textContent = titulo || "Confirmar eliminación";
dlgTask = typeof tarea === "function" ? tarea : null;
dlgBusy(false);

if(!d.open){
d.showModal();
}

return new Promise(resolver => {

if(dlgResolver){
const previo = dlgResolver;
dlgResolver = null;
previo(false);
}

dlgResolver = resolver;

});

}

const dlg = $("dlg");

if(dlg){
$("dlgc").addEventListener("click",()=>dlgCerrar(false));
$("dlgo").addEventListener("click", async ()=>{
if(dlgTask){
dlgBusy(true);
try{
await dlgTask();
dlgCerrar(true);
}catch(e){
dlgBusy(false);
}
return;
}
dlgCerrar(true);
});
dlg.addEventListener("cancel",e=>{e.preventDefault();dlgCerrar(false)});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlgCerrar(false)});
}


const esc = s =>
String(s == null ? "" : s)
.replace(/[&<>"]/g, c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;"
}[c]));


const msg = (t, ok) => {

$("ms").textContent = t || "";

$("ms").style.color = ok ? "var(--pf)" : "";

};


const loginMsg = t => {

$("loginmsg").textContent = t || "";

};


const slug = s =>
s.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"")
+
"-"+
Math.random().toString(36).slice(2,6);


/* =========================
   API SUPABASE
========================= */

async function api(p,m,b){

const r = await fetch(
B + "/rest/v1/" + p,
{
method:m || "GET",

headers:{
apikey:C.SUPABASE_KEY,
Authorization:"Bearer " + T,
"Content-Type":"application/json",
Prefer:"return=representation"
},

body:b !== undefined
? JSON.stringify(b)
: undefined

}
);


/*
   Algunas operaciones pueden devolver
   respuesta vacía. No intentamos convertir
   una respuesta vacía en JSON.
*/

const texto = await r.text();

let j = null;

if(texto){

try{
j = JSON.parse(texto);
}catch(e){
j = texto;
}

}


if(!r.ok){

let errorMsg = "Error HTTP " + r.status;

if(j && j.message){
errorMsg = j.message;
}

if(j && j.error){
errorMsg = j.error;
}

msg(errorMsg);

throw new Error(errorMsg);

}


return j;

}


/* =========================
   LOGIN
========================= */

async function login(){

loginMsg("");

const email = $("em").value.trim();

const password = $("pw").value;


if(!email || !password){

loginMsg("Escribe el correo y la contraseña.");

return;

}


try{

const r = await fetch(
B + "/auth/v1/token?grant_type=password",
{
method:"POST",

headers:{
apikey:C.SUPABASE_KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({
email:email,
password:password
})

}
);


const j = await r.json();


if(!r.ok || !j.access_token){

loginMsg(
j.message ||
"Correo o contraseña incorrectos."
);

return;

}


T = j.access_token;


$("lg").style.display = "none";

$("ad").style.display = "block";


/*
   IMPORTANTE:
   Aquí NO cargamos pedidos.
   Así un problema de RLS de pedidos
   no puede impedir entrar al panel.
*/

await load();

tab("p");


}catch(e){

console.error(e);

loginMsg(
"No se pudo iniciar sesión."
);

}

}


/* =========================
   CARGA PRINCIPAL
========================= */

async function load(){

K = await api(
"categorias?order=orden"
);

P = await api(
"productos?order=created_at.desc"
);

O = await api(
"ofertas?order=created_at.desc"
);


/*
   NO cargar pedidos aquí.
   Se cargan únicamente al entrar
   en la pestaña PEDIDOS.
*/

}


/* =========================
   PESTAÑAS
========================= */

function tab(n){

msg("");

const v = $("v");


if(n === "c"){

v.innerHTML =

'<input id="cn" placeholder="Nueva categoría">'+

'<label for="cf">Imagen de la categoría (opcional)</label><input id="cf" type="file" accept="image/*">'+

'<button onclick="addC()">'+
'AÑADIR CATEGORÍA'+
'</button>'+

K.map(k =>

'<div class="r">'+

(k.imagen?'<img src="'+esc(k.imagen)+'" alt="" style="width:84px;height:60px;object-fit:contain;border-radius:8px;display:block;margin-bottom:8px">':'')+

esc(k.nombre)+

'<br>'+

'<input id="cf-'+k.id+'" type="file" accept="image/*" style="margin-top:8px">'+

'<button onclick="setCImg(\''+
k.id+
'\')">'+
'Subir imagen'+
'</button>'+

'<button class="x" onclick="delC(\''+
k.id+
'\')">'+
'Borrar'+
'</button>'+

'</div>'

).join("");

}


else if(n === "o"){

v.innerHTML =

'<select id="op">'+

P.map(p =>

'<option value="'+
p.id+
'">'+
esc(p.nombre)+
'</option>'

).join("")+

'</select>'+

'<input id="oq" type="number" step="0.01" placeholder="Precio de oferta USD">'+

'<button onclick="addO()">'+
'CREAR OFERTA'+
'</button>'+

O.map(o => {

const p =
P.find(x => x.id == o.producto_id);

return (

'<div class="r">'+

esc(p ? p.nombre : "?")+

' · $'+
o.precio_oferta_usd+

' · '+
(o.activa ? "activa" : "pausada")+

'<br>'+

'<button onclick="togO(\''+
o.id+
'\','+
!o.activa+
')">'+

(o.activa ? "Pausar" : "Activar")+

'</button>'+

'<button class="x" onclick="delO(\''+
o.id+
'\')">'+
'Borrar'+
'</button>'+

'</div>'

);

}).join("");

}


else if(n === "w"){

opsAdmin();

}


else if(n === "d"){

pedidos();

}


else{

form();

}

}


/* =========================================================
   PEDIDOS
========================================================= */

async function pedidos(){

OD = null;


$("v").innerHTML =

'<h3>Pedidos</h3>'+

'<p>Cargando pedidos...</p>';


try{

/*
   Los pedidos se consultan SOLO aquí.
*/

D = await api(
"pedidos?order=created_at.desc"
);


$("v").innerHTML =

'<h3>Pedidos</h3>'+

'<input '+
'id="ds" '+
'placeholder="Buscar por código, cliente o teléfono" '+
'oninput="filtrarPedidos()">'+

'<div id="dl"></div>';


renderPedidos(D);


}catch(e){

console.error(e);


$("v").innerHTML =

'<h3>Pedidos</h3>'+

'<div class="r">'+

'<strong>No se pudieron cargar los pedidos.</strong>'+

'<br><br>'+

'El panel funciona, pero Supabase está rechazando la consulta de pedidos.'+

'<br><br>'+

'<small>'+
esc(e.message || "")+
'</small>'+

'</div>';

}

}


/* =========================
   MOSTRAR PEDIDOS
========================= */

function renderPedidos(a){

const el = $("dl");

if(!el)return;


if(!a || !a.length){

el.innerHTML =

'<div class="r">'+
'No hay pedidos registrados.'+
'</div>';

return;

}


el.innerHTML = a.map(o =>

'<div class="r">'+

'<strong>'+
esc(o.codigo)+
'</strong>'+

'<br>'+

esc(o.nombre_cliente)+

'<br>'+

esc(o.telefono)+

'<br>'+

'<span class="estado">'+
esc(o.estado)+
'</span>'+

'<br>'+

'<strong>$'+
Number(o.total_usd || 0).toFixed(2)+
'</strong>'+

'<br>'+

'<button onclick="verPedido(\''+
o.id+
'\')">'+
'VER PEDIDO'+
'</button>'+

'<button onclick="cambiarEstado(\''+
o.id+
'\')">'+
'CAMBIAR ESTADO'+
'</button>'+

(
o.telefono
?
'<button onclick="waPedido(\''+
o.telefono+
'\',\''+
o.codigo+
'\')">'+
'WHATSAPP'+
'</button>'
:
''
)+

'</div>'

).join("");

}


/* =========================
   BUSCAR PEDIDOS
========================= */

function filtrarPedidos(){

const input = $("ds");

if(!input)return;


const q =
input.value
.trim()
.toLowerCase();


const resultado = D.filter(o =>

!q ||

[
o.codigo,
o.nombre_cliente,
o.telefono,
o.email
]
.some(x =>
String(x || "")
.toLowerCase()
.includes(q)
)

);


renderPedidos(resultado);

}


/* =========================
   ESTADOS OFICIALES
========================= */

function estadoSel(e){

const estados = [

"Pedido recibido",

"Confirmando pedido",

"Preparando pedido",

"En camino",

"Entregado",

"Cancelado"

];


return estados.map(x =>

'<option value="'+
esc(x)+
'"'+
(x === e ? " selected" : "")+
'>'+
esc(x)+
'</option>'

).join("");

}


/* =========================
   VER PEDIDO
========================= */

async function verPedido(id){

const o =
D.find(x => x.id === id);


if(!o)return;


$("v").innerHTML =

'<button class="back" onclick="pedidos()">'+
'← VOLVER A PEDIDOS'+
'</button>'+

'<h3>'+
esc(o.codigo)+
'</h3>'+

'<div class="r">'+

'<strong>CLIENTE</strong>'+

'<br>'+
esc(o.nombre_cliente)+

'<br>'+
esc(o.email || "Sin correo")+

'<br>'+
esc(o.telefono)+

'</div>'+

'<div class="r">'+

'<strong>DIRECCIÓN DE ENTREGA</strong>'+

'<br>'+
esc(o.direccion)+

'<br>'+
esc(o.municipio)+

'</div>'+

'<div class="r">'+

'<strong>NOTAS</strong>'+

'<br>'+
esc(o.notas || "—")+

'</div>'+

'<div class="r">'+

'<strong>ESTADO ACTUAL</strong>'+

'<br>'+

esc(o.estado)+

'</div>'+

'<div class="r">'+

'Cargando productos e historial...'+

'</div>';


try{


const items = await api(
"pedido_items?pedido_id=eq."+
encodeURIComponent(id)+
"&order=created_at"
);


const hist = await api(
"pedido_historial?pedido_id=eq."+
encodeURIComponent(id)+
"&order=created_at"
);


OD = o;


$("v").innerHTML =

'<button class="back" onclick="pedidos()">'+
'← VOLVER A PEDIDOS'+
'</button>'+

'<h3>'+
esc(o.codigo)+
'</h3>'+

'<div class="r">'+

'<strong>CLIENTE</strong>'+

'<br>'+
esc(o.nombre_cliente)+

'<br>'+
esc(o.email || "Sin correo")+

'<br>'+
esc(o.telefono)+

'</div>'+

'<div class="r">'+

'<strong>ENTREGA</strong>'+

'<br>'+
esc(o.direccion)+

'<br>'+
esc(o.municipio)+

'</div>'+

'<div class="r">'+

'<strong>NOTAS</strong>'+

'<br>'+
esc(o.notas || "—")+

'</div>'+

'<div class="r">'+

'<strong>PRODUCTOS</strong>'+

items.map(i =>

'<br>'+

esc(i.producto_nombre)+

' × '+
i.cantidad+

' · $'+
Number(i.precio_unitario || 0).toFixed(2)+

' = $'+
Number(i.subtotal || 0).toFixed(2)

).join("")+

'<br><br>'+

'<strong>TOTAL: $'+
Number(o.total_usd || 0).toFixed(2)+
'</strong>'+

'<br><br>'+

'<strong>GARANTÍA:</strong> '+
esc(o.garantia || "—")+

'<br>'+

'<strong>TRANSPORTE:</strong> '+
esc(o.transporte || "—")+

'</div>'+

'<div class="r">'+

'<strong>CAMBIAR ESTADO</strong>'+

'<select id="ds2">'+

estadoSel(o.estado)+

'</select>'+

'<button onclick="guardarEstado(\''+
o.id+
'\')">'+
'GUARDAR ESTADO'+
'</button>'+

'</div>'+

'<div class="r">'+

'<strong>HISTORIAL</strong>'+

(
hist && hist.length
?
hist.map(h =>

'<br><small>'+

new Date(h.created_at)
.toLocaleString("es-ES")+

' · '+

esc(h.estado)+

(
h.comentario
?
' · '+
esc(h.comentario)
:
''
)+

'</small>'

).join("")
:

'<input id="oph" value="'+(ed ? esc(ed.horario || "") : "")+'" placeholder="Horario de atención" autocomplete="off">'+
'<label for="opo">Orden</label>'+
'<input id="opo" type="number" min="0" step="1" value="'+(ed ? esc(String(ed.orden == null ? 0 : ed.orden)) : nextOrder)+'">'+
'<div class="check"><input type="checkbox" id="opd"'+(ed ? (ed.disponible ? " checked" : "") : " checked")+'><label for="opd">Disponible</label></div>'+
'<div class="check"><input type="checkbox" id="opa"'+(ed ? (ed.activa ? " checked" : "") : " checked")+'><label for="opa">Activa</label></div>'+
'<div class="form-actions">'+
'<button type="button" class="back" onclick="opReset()">Cancelar</button>'+
'<button type="submit">'+(ed ? "Guardar cambios" : "Crear operadora")+'</button>'+
'</div>'+
'</form>'+
'<h4>Listado</h4>'+
lista;

const form = $("opForm");
if(form) form.addEventListener("submit", opSave);
}

async function opSave(e){
e.preventDefault();
const nombre = $("opn").value.trim();
const whatsapp = opDigits($("opw").value);
const horario = $("oph").value.trim();
const disponible = $("opd").checked;
const activa = $("opa").checked;
const orden = Number($("opo").value) || 0;
const form = $("opForm");
const btn = form ? form.querySelector('button[type="submit"]') : null;

if(!nombre){
msg("Escriba el nombre de la operadora.");
$("opn").focus();
return;
}

if(whatsapp.length < 8 || whatsapp.length > 15){
msg("Escriba el WhatsApp con código de país, solo números.");
$("opw").focus();
return;
}

const b = {
nombre: nombre,
whatsapp: whatsapp,
horario: horario,
disponible: disponible,
activa: activa,
orden: orden
};

if(btn){
btn.disabled = true;
btn.textContent = "Guardando...";
}

try{
if(OPEDIT){
await api("operadoras?id=eq."+encodeURIComponent(OPEDIT), "PATCH", b);
}else{
await api("operadoras", "POST", b);
}
OPEDIT = null;
await opsCargar();
msg("Operadora guardada correctamente.", true);
}catch(err){
msg("No se pudo guardar la operadora. " + (err.message || ""));
if(btn){
btn.disabled = false;
btn.textContent = OPEDIT ? "Guardar cambios" : "Crear operadora";
}
}
}

function opEdit(id){
OPEDIT = id;
renderOpsAdmin();
msg("");
const f = $("opn");
if(f){
f.scrollIntoView({behavior: "smooth", block: "center"});
f.focus();
}
}

function opReset(){
OPEDIT = null;
renderOpsAdmin();
msg("");
}

async function opToggle(id){
const o = OP.find(x => x.id === id);
if(!o)return;
try{
await api("operadoras?id=eq."+encodeURIComponent(id), "PATCH", {activa: !o.activa});
await opsCargar();
msg(o.activa ? "Operadora desactivada." : "Operadora activada.", true);
}catch(e){
msg("No se pudo cambiar el estado de la operadora.");
}
}

async function opDelete(id){
const o = OP.find(x => x.id === id);
if(!o)return;

await askDeleteCon(
"¿Eliminar la operadora "+o.nombre+"? Esta acción no se puede deshacer.",
"Eliminar operadora",
async () => {
try{
await api("operadoras?id=eq."+encodeURIComponent(id), "DELETE");
OP = OP.filter(x => x.id !== id);
if(OPEDIT === id) OPEDIT = null;
renderOpsAdmin();
msg("Operadora eliminada correctamente.", true);
}catch(e){
alert("No se pudo eliminar la operadora. " + (e.message || ""));
throw e;
}
}
);
}

</script>
</body>
</html>
