<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">

<title>VOLXEN · Panel</title>

<style>

body{
font:15px sans-serif;
margin:0;
background:#f6f1e7;
color:#0e0e0e
}

header{
background:#0e0e0e;
color:#c9a96e;
padding:14px;
letter-spacing:.3em
}

main{
padding:14px;
max-width:640px;

}

input,
select,
textarea,
button{

padding:11px;

button{

.t{
display:flex;
gap:6px;

}

.t button{

.r button{

background:#b3261e!important;
color:#fff
}

}

</style>
</head>

<body>

<header>
VOLXEN · PANEL
</header>

<main>

<!-- LOGIN -->

<div id="lg">

<h3>Iniciar sesión</h3>

<input
id="em"
type="email"
placeholder="Correo"
autocomplete="username"
>

<input
id="pw"
type="password"
placeholder="Contraseña"
autocomplete="current-password"
>

<button onclick="login()">
ENTRAR
</button>

<p id="loginmsg"></p>

</div>


<!-- PANEL ADMIN -->

<div id="ad" style="display:none">

<div class="t">

<button onclick="tab('p')">
Productos
</button>

<button onclick="tab('c')">
Categorías
</button>

<button onclick="tab('o')">
Ofertas
</button>

<button onclick="tab('d')">
Pedidos
</button>

</div>

<p id="ms"></p>

<div id="v"></div>

</div>

</main>


<script src="config.js"></script>

<script>

/* =========================
   CONFIGURACIÓN
========================= */

const C = window.VOLXEN_CONFIG;

const B = C.SUPABASE_URL;

let T = "";

let K = [];
let P = [];
let O = [];
let D = [];

let E = null;
let IM = [];
let OD = null;


/* =========================
   UTILIDADES
========================= */

const $ = i => document.getElementById(i);


const esc = s =>
String(s == null ? "" : s)
.replace(/[&<>"]/g, c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;"
}[c]));


const msg = t => {

$("ms").textContent = t || "";

};


const loginMsg = t => {

$("loginmsg").textContent = t || "";

};


const slug = s =>
s.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"")
+
"-"+
Math.random().toString(36).slice(2,6);


/* =========================
   API SUPABASE
========================= */

async function api(p,m,b){

const r = await fetch(
B + "/rest/v1/" + p,
{
method:m || "GET",

headers:{
apikey:C.SUPABASE_KEY,
Authorization:"Bearer " + T,
"Content-Type":"application/json",
Prefer:"return=representation"
},

body:b !== undefined
? JSON.stringify(b)
: undefined

}
);


/*
   Algunas operaciones pueden devolver
   respuesta vacía. No intentamos convertir
   una respuesta vacía en JSON.
*/

const texto = await r.text();

let j = null;

if(texto){

try{
j = JSON.parse(texto);
}catch(e){
j = texto;
}

}


if(!r.ok){

let errorMsg = "Error HTTP " + r.status;

if(j && j.message){
errorMsg = j.message;
}

if(j && j.error){
errorMsg = j.error;
}

msg(errorMsg);

throw new Error(errorMsg);

}


return j;

}


/* =========================
   LOGIN
========================= */

async function login(){

loginMsg("");

const email = $("em").value.trim();

const password = $("pw").value;


if(!email || !password){

loginMsg("Escribe el correo y la contraseña.");

return;

}


try{

const r = await fetch(
B + "/auth/v1/token?grant_type=password",
{
method:"POST",

headers:{
apikey:C.SUPABASE_KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({
email:email,
password:password
})

}
);


const j = await r.json();


if(!r.ok || !j.access_token){

loginMsg(
j.message ||
"Correo o contraseña incorrectos."
);

return;

}


T = j.access_token;


$("lg").style.display = "none";

$("ad").style.display = "block";


/*
   IMPORTANTE:
   Aquí NO cargamos pedidos.
   Así un problema de RLS de pedidos
   no puede impedir entrar al panel.
*/

await load();

tab("p");


}catch(e){

console.error(e);

loginMsg(
"No se pudo iniciar sesión."
);

}

}


/* =========================
   CARGA PRINCIPAL
========================= */

async function load(){

K = await api(
"categorias?order=orden"
);

P = await api(
"productos?order=created_at.desc"
);

O = await api(
"ofertas?order=created_at.desc"
);


/*
   NO cargar pedidos aquí.
   Se cargan únicamente al entrar
   en la pestaña PEDIDOS.
*/

}


/* =========================
   PESTAÑAS
========================= */

function tab(n){

msg("");

const v = $("v");


if(n === "c"){

v.innerHTML =

'<input id="cn" placeholder="Nueva categoría">'+

'<button onclick="addC()">'+
'AÑADIR CATEGORÍA'+
'</button>'+

K.map(k =>

'<div class="r">'+

esc(k.nombre)+

'<br>'+

'<button class="x" onclick="delC(\''+
k.id+
'\')">'+
'Borrar'+
'</button>'+

'</div>'

).join("");

}


else if(n === "o"){

v.innerHTML =

'<select id="op">'+

P.map(p =>

'<option value="'+
p.id+
'">'+
esc(p.nombre)+
'</option>'

).join("")+

'</select>'+

'<input id="oq" type="number" step="0.01" placeholder="Precio de oferta USD">'+

'<button onclick="addO()">'+
'CREAR OFERTA'+
'</button>'+

O.map(o => {

const p =
P.find(x => x.id == o.producto_id);

return (

'<div class="r">'+

esc(p ? p.nombre : "?")+

' · $'+
o.precio_oferta_usd+

' · '+
(o.activa ? "activa" : "pausada")+

'<br>'+

'<button onclick="togO(\''+
o.id+
'\','+
!o.activa+
')">'+

(o.activa ? "Pausar" : "Activar")+

'</button>'+

'<button class="x" onclick="delO(\''+
o.id+
'\')">'+
'Borrar'+
'</button>'+

'</div>'

);

}).join("");

}


else if(n === "d"){

pedidos();

}


else{

form();

}

}


/* =========================================================
   PEDIDOS
========================================================= */

async function pedidos(){

OD = null;


$("v").innerHTML =

'<h3>Pedidos</h3>'+

'<p>Cargando pedidos...</p>';


try{

/*
   Los pedidos se consultan SOLO aquí.
*/

D = await api(
"pedidos?order=created_at.desc"
);


$("v").innerHTML =

'<h3>Pedidos</h3>'+

'<input '+
'id="ds" '+
'placeholder="Buscar por código, cliente o teléfono" '+
'oninput="filtrarPedidos()">'+

'<div id="dl"></div>';


renderPedidos(D);


}catch(e){

console.error(e);


$("v").innerHTML =

'<h3>Pedidos</h3>'+

'<div class="r">'+

'<strong>No se pudieron cargar los pedidos.</strong>'+

'<br><br>'+

'El panel funciona, pero Supabase está rechazando la consulta de pedidos.'+

'<br><br>'+

'<small>'+
esc(e.message || "")+
'</small>'+

'</div>';

}

}


/* =========================
   MOSTRAR PEDIDOS
========================= */

function renderPedidos(a){

const el = $("dl");

if(!el)return;


if(!a || !a.length){

el.innerHTML =

'<div class="r">'+
'No hay pedidos registrados.'+
'</div>';

return;

}


el.innerHTML = a.map(o =>

'<div class="r">'+

'<strong>'+
esc(o.codigo)+
'</strong>'+

'<br>'+

esc(o.nombre_cliente)+

'<br>'+

esc(o.telefono)+

'<br>'+

'<span class="estado">'+
esc(o.estado)+
'</span>'+

'<br>'+

'<strong>$'+
Number(o.total_usd || 0).toFixed(2)+
'</strong>'+

'<br>'+

'<button onclick="verPedido(\''+
o.id+
'\')">'+
'VER PEDIDO'+
'</button>'+

'<button onclick="cambiarEstado(\''+
o.id+
'\')">'+
'CAMBIAR ESTADO'+
'</button>'+

(
o.telefono
?
'<button onclick="waPedido(\''+
o.telefono+
'\',\''+
o.codigo+
'\')">'+
'WHATSAPP'+
'</button>'
:
''
)+

'</div>'

).join("");

}


/* =========================
   BUSCAR PEDIDOS
========================= */

function filtrarPedidos(){

const input = $("ds");

if(!input)return;


const q =
input.value
.trim()
.toLowerCase();


const resultado = D.filter(o =>

!q ||

[
o.codigo,
o.nombre_cliente,
o.telefono,
o.email
]
.some(x =>
String(x || "")
.toLowerCase()
.includes(q)
)

);


renderPedidos(resultado);

}


/* =========================
   ESTADOS OFICIALES
========================= */

function estadoSel(e){

const estados = [

"Pedido recibido",

"Confirmando pedido",

"Preparando pedido",

"En camino",

"Entregado",

"Cancelado"

];


return estados.map(x =>

'<option value="'+
esc(x)+
'"'+
(x === e ? " selected" : "")+
'>'+
esc(x)+
'</option>'

).join("");

}


/* =========================
   VER PEDIDO
========================= */

async function verPedido(id){

const o =
D.find(x => x.id === id);


if(!o)return;


$("v").innerHTML =

'<button class="back" onclick="pedidos()">'+
'← VOLVER A PEDIDOS'+
'</button>'+

'<h3>'+
esc(o.codigo)+
'</h3>'+

'<div class="r">'+

'<strong>CLIENTE</strong>'+

'<br>'+
esc(o.nombre_cliente)+

'<br>'+
esc(o.email || "Sin correo")+

'<br>'+
esc(o.telefono)+

'</div>'+

'<div class="r">'+

'<strong>DIRECCIÓN DE ENTREGA</strong>'+

'<br>'+
esc(o.direccion)+

'<br>'+
esc(o.municipio)+

'</div>'+

'<div class="r">'+

'<strong>NOTAS</strong>'+

'<br>'+
esc(o.notas || "—")+

'</div>'+

'<div class="r">'+

'<strong>ESTADO ACTUAL</strong>'+

'<br>'+

esc(o.estado)+

'</div>'+

'<div class="r">'+

'Cargando productos e historial...'+

'</div>';


try{


const items = await api(
"pedido_items?pedido_id=eq."+
encodeURIComponent(id)+
"&order=created_at"
);


const hist = await api(
"pedido_historial?pedido_id=eq."+
encodeURIComponent(id)+
"&order=created_at"
);


OD = o;


$("v").innerHTML =

'<button class="back" onclick="pedidos()">'+
'← VOLVER A PEDIDOS'+
'</button>'+

'<h3>'+
esc(o.codigo)+
'</h3>'+

'<div class="r">'+

'<strong>CLIENTE</strong>'+

'<br>'+
esc(o.nombre_cliente)+

'<br>'+
esc(o.email || "Sin correo")+

'<br>'+
esc(o.telefono)+

'</div>'+

'<div class="r">'+

'<strong>ENTREGA</strong>'+

'<br>'+
esc(o.direccion)+

'<br>'+
esc(o.municipio)+

'</div>'+

'<div class="r">'+

'<strong>NOTAS</strong>'+

'<br>'+
esc(o.notas || "—")+

'</div>'+

'<div class="r">'+

'<strong>PRODUCTOS</strong>'+

items.map(i =>

'<br>'+

esc(i.producto_nombre)+

' × '+
i.cantidad+

' · $'+
Number(i.precio_unitario || 0).toFixed(2)+

' = $'+
Number(i.subtotal || 0).toFixed(2)

).join("")+

'<br><br>'+

'<strong>TOTAL: $'+
Number(o.total_usd || 0).toFixed(2)+
'</strong>'+

'<br><br>'+

'<strong>GARANTÍA:</strong> '+
esc(o.garantia || "—")+

'<br>'+

'<strong>TRANSPORTE:</strong> '+
esc(o.transporte || "—")+

'</div>'+

'<div class="r">'+

'<strong>CAMBIAR ESTADO</strong>'+

'<select id="ds2">'+

estadoSel(o.estado)+

'</select>'+

'<button onclick="guardarEstado(\''+
o.id+
'\')">'+
'GUARDAR ESTADO'+
'</button>'+

'</div>'+

'<div class="r">'+

'<strong>HISTORIAL</strong>'+

(
hist && hist.length
?
hist.map(h =>

'<br><small>'+

new Date(h.created_at)
.toLocaleString("es-ES")+

' · '+

esc(h.estado)+

(
h.comentario
?
' · '+
esc(h.comentario)
:
''
)+

'</small>'

).join("")
:
'<br>Sin historial.'
)+

'</div>'+

(
o.telefono
?

'<button onclick="waPedido(\''+
o.telefono+
'\',\''+
o.codigo+
'\')">'+
'CONTACTAR POR WHATSAPP'+
'</button>'

:
''
);


}catch(e){

console.error(e);

$("v").innerHTML +=

'<div class="r">'+

'<strong>Error cargando detalle.</strong>'+

'<br>'+

esc(e.message || "")+

'</div>';

}

}


/* =========================
   GUARDAR ESTADO
========================= */

async function guardarEstado(id){

const select = $("ds2");

if(!select)return;


const estado = select.value;


try{

await api(
"pedidos?id=eq."+
encodeURIComponent(id),

"PATCH",

{
estado:estado
}

);


await load();

msg("Estado actualizado correctamente.");


await pedidos();


await verPedido(id);


}catch(e){

alert(
"No se pudo actualizar el estado."
);

}

}


/* =========================
   CAMBIAR ESTADO RÁPIDO
========================= */

async function cambiarEstado(id){

const o =
D.find(x => x.id === id);


if(!o)return;


const estado = prompt(

"Escribe el nuevo estado exactamente como aparece:\n\n"+

"Pedido recibido\n"+
"Confirmando pedido\n"+
"Preparando pedido\n"+
"En camino\n"+
"Entregado\n"+
"Cancelado",

o.estado

);


if(!estado)return;


const estados = [

"Pedido recibido",

"Confirmando pedido",

"Preparando pedido",

"En camino",

"Entregado",

"Cancelado"

];


if(!estados.includes(estado)){

alert(
"Estado no válido."
);

return;

}


try{

await api(
"pedidos?id=eq."+
encodeURIComponent(id),

"PATCH",

{
estado:estado
}

);


D = await api(
"pedidos?order=created_at.desc"
);


pedidos();


msg(
"Estado actualizado correctamente."
);


}catch(e){

alert(
"No se pudo actualizar el estado."
);

}

}


/* =========================
   WHATSAPP
========================= */

function waPedido(t,c){

let n = String(t || "")
.replace(/[^0-9]/g,"");


if(!n)return;


if(n.length === 8){

n = "53" + n;

}


const texto =

"Hola, le contactamos desde VOLXEN sobre su pedido "+
c+
".";


window.open(

"https://wa.me/"+
n+
"?text="+
encodeURIComponent(texto),

"_blank"

);

}


/* =========================================================
   PRODUCTOS
========================================================= */

function thumbs(){

const th = $("th");

if(!th)return;


th.innerHTML = IM.map((u,i) =>

'<span style="position:relative;display:inline-block;margin:4px">'+

'<img src="'+
esc(u)+
'" style="width:72px;height:72px;object-fit:cover;border:1px solid #bbb">'+

'<button class="x" style="width:auto;padding:0 7px;margin:0;position:absolute;top:0;right:0" onclick="rmI('+i+')">'+
'×'+
'</button>'+

'</span>'

).join("");

}


function rmI(i){

IM.splice(i,1);

thumbs();

}


function form(p){

p = p || {};

E = p.id || null;


IM =

(p.imagenes && p.imagenes.length)

?

p.imagenes.slice()

:

(
p.imagen_principal
?
[p.imagen_principal]
:
[]
);


const d =
p.disponibilidad ||
"disponible";


$("v").innerHTML =

'<h3>'+
(E ? "Editar" : "Nuevo")+
' producto</h3>'+

'<input id="n" placeholder="Nombre" value="'+
esc(p.nombre)+
'">'+

'<select id="k">'+

'<option value="">Sin categoría</option>'+

K.map(k =>

'<option value="'+
k.id+
'"'+
(k.id == p.categoria_id
?
" selected"
:
"")+
'>'+
esc(k.nombre)+
'</option>'

).join("")+

'</select>'+

'<input id="pr" type="number" step="0.01" placeholder="Precio USD" value="'+
esc(p.precio_usd)+
'">'+

'<select id="d">'+

[
"disponible",
"bajo_pedido",
"agotado"
].map(x =>

'<option'+
(x == d ? " selected" : "")+
'>'+
x+
'</option>'

).join("")+

'</select>'+

'<input id="g" placeholder="Garantía" value="'+
esc(p.garantia)+
'">'+

'<input id="tr" placeholder="Transporte" value="'+
esc(p.transporte)+
'">'+

'<textarea id="de" rows="3" placeholder="Descripción">'+
esc(p.descripcion)+
'</textarea>'+

'<textarea id="ca" rows="3" placeholder="Características (una por línea)">'+
esc(
(p.caracteristicas || [])
.join("\n")
)+
'</textarea>'+

'<p>Fotos (la primera es la principal). Puedes elegir varias:</p>'+

'<div id="th"></div>'+

'<input id="f" type="file" accept="image/*" multiple>'+

'<label>'+

'<input id="ac" type="checkbox" style="width:auto"'+
(p.activo === false ? "" : " checked")+
'>'+

' Visible en la web'+

'</label>'+

'<button onclick="saveP()">GUARDAR</button>'+

'<button onclick="form()" style="background:#ddd">'+
'Nuevo / limpiar'+
'</button>'+

P.map(x =>

'<div class="r">'+

esc(x.nombre)+
' · $'+
x.precio_usd+

'<br>'+

'<button onclick="editP(\''+
x.id+
'\')">'+
'Editar'+
'</button>'+

'<button class="x" onclick="delP(\''+
x.id+
'\')">'+
'Borrar'+
'</button>'+

'</div>'

).join("");


thumbs();

}


/* =========================
   GUARDAR PRODUCTO
========================= */

async function saveP(){

const n =
$("n").value.trim();


if(!n || !$("pr").value){

msg(
"Falta nombre o precio"
);

return;

}


const fs =
[...$("f").files];


for(let i=0;i<fs.length;i++){

const f = fs[i];


msg(
"Subiendo foto "+
(i+1)+
" de "+
fs.length+
"..."
);


const nm =

Date.now()+
"-"+
i+
"-"+
f.name.replace(
/[^a-z0-9.]/gi,
"_"
);


const r = await fetch(

B+
"/storage/v1/object/productos/"+
nm,

{
method:"POST",

headers:{
apikey:C.SUPABASE_KEY,
Authorization:"Bearer "+T,
"Content-Type":f.type
},

body:f

}

);


if(!r.ok){

msg(
"Error subiendo la foto "+
(i+1)
);

return;

}


IM.push(

B+
"/storage/v1/object/public/productos/"+
nm

);

}


const b = {

nombre:n,

categoria_id:
$("k").value || null,

precio_usd:
+$("pr").value,

disponibilidad:
$("d").value,

garantia:
$("g").value,

transporte:
$("tr").value,

descripcion:
$("de").value,

caracteristicas:
$("ca").value
.split("\n")
.map(s => s.trim())
.filter(Boolean),

imagen_principal:
IM[0] || null,

imagenes:
IM,

activo:
$("ac").checked,

updated_at:
new Date().toISOString()

};


try{


if(E){

await api(
"productos?id=eq."+
encodeURIComponent(E),

"PATCH",

b

);

}else{

b.slug =
slug(n);

await api(
"productos",
"POST",
b
);

}


await load();

tab("p");

msg(
"Guardado correctamente"
);


}catch(e){

msg(
"No se pudo guardar el producto."
);

}

}


/* =========================
   EDITAR PRODUCTO
========================= */

function editP(id){

form(
P.find(x => x.id == id)
);

scrollTo(0,0);

}


/* =========================
   BORRAR PRODUCTO
========================= */

async function delP(id){

if(!confirm("¿Borrar producto?"))return;


try{

await api(
"productos?id=eq."+
encodeURIComponent(id),

"DELETE"
);


await load();

tab("p");


}catch(e){

alert(
"No se pudo borrar el producto."
);

}

}


/* =========================================================
   CATEGORÍAS
========================================================= */

async function addC(){

const n =
$("cn").value.trim();


if(!n)return;


try{

await api(
"categorias",
"POST",
{
nombre:n,
slug:slug(n),
orden:K.length
}
);


await load();

tab("c");


}catch(e){

alert(
"No se pudo crear la categoría."
);

}

}


async function delC(id){

if(!confirm("¿Borrar categoría?"))return;

async function addO(){

!$("op").value ||
!$("oq").value
)return;

"ofertas",
"POST",
{
producto_id:$("op").value,

}
);


await load();

tab("o");


}catch(e){

"No se pudo crear la oferta."
);

}

);

/* =========================================================
   CONSULTAS E INCIDENCIAS
   ========================================================= */
let Q=[];
const QE={nueva:"Nueva",en_atencion:"En atención",resuelta:"Resuelta"};
const QT={consulta:"Consulta general",incidencia:"Incidencia"};
const qf=d=>new Date(d).toLocaleString("es-ES");
function qBadge(){const n=Q.filter(x=>x.estado==="nueva").length,b=$("tq");if(b)b.textContent="Consultas"+(n?" ("+n+")":"")}
document.querySelector(".t").insertAdjacentHTML("beforeend",'<button id="tq" onclick="tab(\'q\')">Consultas</button>');
const tab0=tab;tab=function(n){if(n==="q"){consultas();return}tab0(n)};
const load0=load;load=async function(){await load0();try{Q=await api("consultas?order=created_at.desc");qBadge()}catch(e){}};
function consultas(){msg("");
$("v").innerHTML='<h3>Consultas e incidencias</h3><select id="qt" onchange="qFilt()"><option value="">Todas</option><option value="consulta">Consultas generales</option><option value="incidencia">Incidencias</option></select><select id="qe" onchange="qFilt()"><option value="">Todos los estados</option><option value="nueva">Nuevas</option><option value="en_atencion">En atención</option><option value="resuelta">Resueltas</option></select><input id="qs" placeholder="Buscar por nombre, contacto, pedido o mensaje" oninput="qFilt()"><div id="ql"><div class="r">Cargando...</div></div>';
qCargar()}
async function qCargar(){try{Q=await api("consultas?order=created_at.desc");qBadge();qFilt()}catch(e){const l=$("ql");if(l)l.innerHTML='<div class="r"><strong>No se pudieron cargar las consultas.</strong><br><small>'+esc(e.message||"")+'</small></div>'}}
function qFilt(){const t=$("qt"),e=$("qe"),s=$("qs");if(!t||!e||!s)return;const q=s.value.trim().toLowerCase();
const a=Q.filter(x=>(!t.value||x.tipo===t.value)&&(!e.value||x.estado===e.value)&&(!q||[x.nombre,x.contacto,x.codigo_pedido,x.mensaje].some(y=>String(y||"").toLowerCase().includes(q))));
$("ql").innerHTML=a.length?a.map(x=>'<div class="r"><strong>'+esc(QT[x.tipo]||x.tipo)+'</strong> · <span class="estado">'+esc(QE[x.estado]||x.estado)+'</span><br>'+esc(x.nombre||"Sin nombre")+' · '+esc(x.contacto||"")+(x.codigo_pedido?'<br>Pedido: '+esc(x.codigo_pedido):'')+'<br><small>'+qf(x.created_at)+'</small><br>'+esc(String(x.mensaje).slice(0,120))+(String(x.mensaje).length>120?"…":"")+'<br><button onclick="qVer(\''+x.id+'\')">VER</button>'+(x.contacto?'<button onclick="qWa(\''+x.id+'\')">WHATSAPP</button>':'')+'</div>').join(""):'<div class="r">No hay mensajes.</div>'}
function qVer(id){const x=Q.find(y=>y.id===id);if(!x)return;
$("v").innerHTML='<button class="back" onclick="consultas()">← VOLVER</button><h3>'+esc(QT[x.tipo]||x.tipo)+'</h3><div class="r"><strong>CONTACTO</strong><br>'+esc(x.nombre||"Sin nombre")+'<br>'+esc(x.contacto||"—")+(x.codigo_pedido?'<br>Pedido: '+esc(x.codigo_pedido):'')+'<br><small>'+qf(x.created_at)+'</small></div><div class="r"><strong>MENSAJE</strong><br>'+esc(x.mensaje).replace(/\n/g,"<br>")+'</div><div class="r"><strong>ESTADO</strong><select id="qe2">'+Object.keys(QE).map(k=>'<option value="'+k+'"'+(k===x.estado?" selected":"")+'>'+QE[k]+'</option>').join("")+'</select><button onclick="qGuardar(\''+x.id+'\')">GUARDAR ESTADO</button></div>'+(x.contacto?'<button onclick="qWa(\''+x.id+'\')">CONTACTAR POR WHATSAPP</button>':'')+'<button class="x" onclick="qBorrar(\''+x.id+'\')">BORRAR</button>'}
async function qGuardar(id){try{const s=$("qe2").value;await api("consultas?id=eq."+encodeURIComponent(id),"PATCH",{estado:s});const x=Q.find(y=>y.id===id);if(x)x.estado=s;qBadge();qVer(id);msg("Estado actualizado correctamente.")}catch(e){alert("No se pudo actualizar el estado.")}}
async function qBorrar(id){if(!confirm("¿Borrar este mensaje?"))return;try{await api("consultas?id=eq."+encodeURIComponent(id),"DELETE");Q=Q.filter(y=>y.id!==id);qBadge();consultas()}catch(e){alert("No se pudo borrar el mensaje.")}}
function qWa(id){const x=Q.find(y=>y.id===id);if(!x)return;let n=String(x.contacto||"").replace(/\D/g,"");if(!n)return;if(n.length===8)n="53"+n;
window.open("https://wa.me/"+n+"?text="+encodeURIComponent("Hola, le contactamos desde VOLXEN sobre su "+(x.tipo==="incidencia"?"incidencia":"consulta")+(x.codigo_pedido?" del pedido "+x.codigo_pedido:"")+"."),"_blank")}
</script>
