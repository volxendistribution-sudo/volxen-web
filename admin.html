<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">

<title>VOLXEN · Panel</title>

<style>
@font-face{font-family:'DM Sans';font-style:normal;font-weight:400;font-display:swap;src:url('dist/fonts/DM-Sans-Regular.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:600;font-display:swap;src:url('dist/fonts/DM-Sans-SemiBold.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:700;font-display:swap;src:url('dist/fonts/DM-Sans-Bold.woff2') format('woff2')}
@font-face{font-family:'Inter Tight';font-style:normal;font-weight:400;font-display:swap;src:url('dist/fonts/InterTight-Regular.woff2') format('woff2')}
@font-face{font-family:'Inter Tight';font-style:normal;font-weight:600;font-display:swap;src:url('dist/fonts/InterTight-SemiBold.woff2') format('woff2')}

:root{
--bg:#F8F7F4;--sf:#EAE6DE;--s2:#FFFDF9;--fg:#1E1D1B;--mu:rgba(30,29,27,.62);
--bd:rgba(30,29,27,.14);--g:#C8A165;--gi:#6E5327;--pf:#2E4A3F;--ox:#A64B30;--ox-hover:#8A3D26;
--d:'DM Sans',system-ui,sans-serif;--s:'Inter Tight',system-ui,sans-serif;
--shadow-sm:0 1px 2px rgba(18,16,12,.04);
--radius-field:12px;--radius-card:24px;--radius-pill:999px;--control-h:48px
}

*{box-sizing:border-box}

body{
font:400 14px/1.6 var(--s);
margin:0;
background:var(--bg);
color:var(--fg)
}

header{
background:var(--pf);
color:var(--s2);
padding:20px 16px;
font:700 14px/1.4 var(--d);
letter-spacing:.18em;
text-transform:uppercase
}

main{
padding:16px;
max-width:720px;
margin:auto
}

h1,h2,h3,h4{font-family:var(--d);margin:20px 0 8px;line-height:1.3}
h1{font-size:24px}
h2,h3{font-size:16px}
h4{font-size:14px}
p{margin:8px 0}

input,select,textarea{
width:100%;
min-height:var(--control-h);
padding:12px 16px;
margin:8px 0;
font:400 16px var(--s);
border:1px solid var(--bd);
border-radius:var(--radius-field);
background:var(--s2);
color:var(--fg);
box-sizing:border-box
}

textarea{min-height:96px;padding-top:12px;resize:vertical}

input:focus,select:focus,textarea:focus{
outline:none;
border-color:var(--gi);
box-shadow:0 0 0 3px rgba(110,83,39,.24)
}

button{
width:100%;
min-height:var(--control-h);
padding:12px 18px;
margin:8px 0;
font:600 14px var(--s);
border:1px solid transparent;
border-radius:var(--radius-pill);
background:var(--pf);
color:var(--s2);
cursor:pointer;
transition:background .2s,border-color .2s,color .2s
}

button:hover{background:var(--g);border-color:var(--g);color:var(--fg)}
button:active{transform:translateY(1px)}

.t{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.t button{flex:1;min-width:110px;background:var(--s2);color:var(--fg);border-color:var(--bd)}
.t button:hover{background:var(--g);border-color:var(--g)}

.r{
background:var(--s2);
padding:16px;
margin:12px 0;
border:1px solid var(--bd);
border-radius:var(--radius-card);
box-shadow:var(--shadow-sm)
}

.r button{
width:auto;
min-height:44px;
padding:8px 14px;
margin:8px 6px 0 0;
font-size:12px
}

.x{background:var(--ox)!important;border-color:var(--ox)!important;color:#fff}
.x:hover{background:var(--ox-hover)!important;border-color:var(--ox-hover)!important}

.back{background:var(--s2);color:var(--fg);border-color:var(--bd)}
.back:hover{background:var(--sf);border-color:var(--bd);color:var(--fg)}

.estado{font-weight:600}

.cancel-alert{
margin:10px 0;
padding:10px 12px;
color:var(--ox);
font:700 12px/1.45 var(--s);
background:rgba(166,75,48,.08);
border:1px solid rgba(166,75,48,.3);
border-radius:10px
}

small{font-size:12px;line-height:1.5;color:var(--mu)}

.order-items{display:grid;gap:8px;margin-top:8px}
.order-item{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--s2)}
.order-item strong{display:block;font-size:12px}
.order-item small{display:block}

#lg{background:var(--s2);border:1px solid var(--bd);border-radius:var(--radius-card);padding:24px;margin-top:24px}

#ms{min-height:20px;color:var(--ox)}

#dlg{
width:340px;
max-width:calc(100vw - 32px);
padding:24px;
border:1px solid var(--bd);
border-radius:var(--radius-card);
background:var(--s2);
color:var(--fg);
box-shadow:0 20px 40px -12px rgba(18,16,12,.35)
}

#dlg::backdrop{background:rgba(18,16,12,.55)}
#dlg h3{margin-top:0}
#dlg p{color:var(--mu)}
.dlg-a{display:flex;gap:8px;margin-top:8px}
.dlg-a button{flex:1}


#dlg{text-align:center}
.dlg-ico{
width:48px;height:48px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
border-radius:16px;background:rgba(46,74,63,.09);color:var(--pf)
}
.dlg-ico svg{width:26px;height:26px}
.dlg-a button:disabled{opacity:.55;cursor:not-allowed}
.admin-form{max-width:560px;margin:16px auto 24px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--radius-card);box-shadow:var(--shadow-sm);padding:24px}
.admin-form h3{text-align:center;font-size:24px;margin:0 0 8px}
.admin-form .form-intro{text-align:center;color:var(--mu);margin:0 auto 16px;max-width:34rem}
.admin-form label{display:block;font:700 14px/1.3 var(--d);margin:14px 0 6px;color:var(--fg)}
.admin-form input,.admin-form select,.admin-form textarea{background:var(--sf);border-color:transparent;margin:0}
.admin-form textarea{min-height:120px}
.admin-form .check{display:flex;align-items:center;gap:10px;margin-top:12px}
.admin-form .check input{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--pf)}
.admin-form .check label{margin:0;font:600 14px/1.3 var(--s)}
.form-actions{display:flex;gap:12px;margin-top:20px}
.form-actions button{flex:1;margin:0;min-height:var(--control-h);border-radius:var(--radius-pill)}
.op-row-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.op-badge{display:inline-block;padding:2px 8px;border-radius:var(--radius-pill);background:var(--sf);color:var(--mu);font:600 12px/1.6 var(--s)}
.op-badge.on{background:rgba(46,74,63,.1);color:var(--pf)}
.op-badge.off{background:rgba(166,75,48,.1);color:var(--ox)}
.op-badge.gold{background:rgba(200,161,101,.18);color:#6E5327}
.op-badge.danger{background:rgba(166,75,48,.1);color:var(--ox)}
.cm-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.cm-tools input,.cm-tools select{flex:1;min-width:160px;margin:0}
.cm-meta{display:block;color:var(--mu);font-size:12px;line-height:1.7;margin-top:4px}
.op-meta{display:block;color:var(--mu);font-size:12px;line-height:1.6;margin-top:4px}
</style>
</head>

<body>

<header>
VOLXEN · PANEL
</header>

<main>

<!-- LOGIN -->

<div id="lg">

<h3>Iniciar sesión</h3>

<input
id="em"
type="email"
placeholder="Correo"
autocomplete="username"
>

<input
id="pw"
type="password"
placeholder="Contraseña"
autocomplete="current-password"
>

<button onclick="login()">
ENTRAR
</button>

<p id="loginmsg"></p>

</div>


<!-- PANEL ADMIN -->

<div id="ad" style="display:none">

<div class="t">

<button onclick="tab('p')">
Productos
</button>

<button onclick="tab('c')">
Categorías
</button>

<button onclick="tab('o')">
Ofertas
</button>

<button onclick="tab('w')">
Operadoras
</button>

<button onclick="tab('g')">
Promotores
</button>

<button onclick="tab('m')">
Comisiones
</button>

<button onclick="tab('d')">
Pedidos
</button>

<button class="back" onclick="cerrarSesion()">
Salir
</button>

</div>

<p id="ms"></p>

<div id="v"></div>

</div>

</main>


<dialog id="dlg" aria-labelledby="dlgt" aria-describedby="dlgm">
<div class="dlg-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.7 2.4 17a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div>
<h3 id="dlgt">Confirmar eliminación</h3>
<p id="dlgm"></p>
<div class="dlg-a">
<button type="button" class="back" id="dlgc">Cancelar</button>
<button type="button" class="x" id="dlgo">Eliminar</button>
</div>
</dialog>

<script src="config.js"></script>
<script src="auth.js"></script>

<script>

/* =========================
   CONFIGURACIÓN
========================= */

const C = window.VOLXEN_CONFIG;

const B = C.SUPABASE_URL;

let T = "";
let ME = "";

let K = [];
let P = [];
let O = [];
let D = [];
let U = [];
let UL = false;
let CM = [];

let E = null;
let IM = [];
let OD = null;
let OP = [];
let OPEDIT = null;


/* =========================
   UTILIDADES
========================= */

const $ = i => document.getElementById(i);

/* =========================
   MODAL DE CONFIRMACIÓN
========================= */

let dlgResolver = null;
let dlgTask = null;

function dlgBusy(b){
const a = $("dlgc"), o = $("dlgo");
if(a) a.disabled = !!b;
if(o) o.disabled = !!b;
}

function dlgCerrar(valor){

const d = $("dlg");
const o = $("dlgo");

if(valor === false && o && o.disabled) return;

if(d && d.open){
d.close();
}

dlgBusy(false);
dlgTask = null;

if(dlgResolver){
const r = dlgResolver;
dlgResolver = null;
r(valor);
}

}

function askDelete(texto){
return askDeleteCon(texto, "Confirmar eliminación");
}

function askDeleteCon(texto, titulo, tarea, etiqueta){

const d = $("dlg");
const m = $("dlgm");
const t = $("dlgt");
const b = $("dlgo");

if(!d || typeof d.showModal !== "function"){
return Promise.resolve(window.confirm(texto)).then(ok => ok && typeof tarea === "function" ? tarea() : ok);
}

m.textContent = texto;
if(t) t.textContent = titulo || "Confirmar eliminación";
if(b) b.textContent = etiqueta || "Eliminar";
dlgTask = typeof tarea === "function" ? tarea : null;
dlgBusy(false);

if(!d.open){
d.showModal();
}

return new Promise(resolver => {

if(dlgResolver){
const previo = dlgResolver;
dlgResolver = null;
previo(false);
}

dlgResolver = resolver;

});

}

const dlg = $("dlg");

if(dlg){
$("dlgc").addEventListener("click",()=>dlgCerrar(false));
$("dlgo").addEventListener("click", async ()=>{
if(dlgTask){
dlgBusy(true);
try{
await dlgTask();
dlgCerrar(true);
}catch(e){
dlgBusy(false);
}
return;
}
dlgCerrar(true);
});
dlg.addEventListener("cancel",e=>{e.preventDefault();dlgCerrar(false)});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlgCerrar(false)});
}


const esc = s =>
String(s == null ? "" : s)
.replace(/[&<>"]/g, c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;"
}[c]));


const msg = (t, ok) => {

$("ms").textContent = t || "";

$("ms").style.color = ok ? "var(--pf)" : "";

};


const loginMsg = t => {

$("loginmsg").textContent = t || "";

};


function salirLocal(texto){

T = "";
ME = "";

K = [];
P = [];
O = [];
D = [];
U = [];
UL = false;
CM = [];
OD = null;
OP = [];
OPEDIT = null;
E = null;
IM = [];

const ad = $("ad");
const lg = $("lg");
const pw = $("pw");
const v = $("v");

if(ad) ad.style.display = "none";
if(lg) lg.style.display = "block";
if(pw) pw.value = "";
if(v) v.innerHTML = "";

loginMsg(texto || "");

}


async function cerrarSesion(){

const token = T;

if(window.VXAUTH){

try{
await VXAUTH.signOut();
}catch(e){}

}else if(token){

try{

await fetch(
B + "/auth/v1/logout",
{
method:"POST",
headers:{
apikey:C.SUPABASE_KEY,
Authorization:"Bearer " + token
}
}
);

}catch(e){}

}

salirLocal("Sesión cerrada.");

}


const slug = s =>
s.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"")
+
"-"+
Math.random().toString(36).slice(2,6);


/* =========================
   API SUPABASE
========================= */

async function api(p,m,b){

const r = await fetch(
B + "/rest/v1/" + p,
{
method:m || "GET",

headers:{
apikey:C.SUPABASE_KEY,
Authorization:"Bearer " + T,
"Content-Type":"application/json",
Prefer:"return=representation"
},

body:b !== undefined
? JSON.stringify(b)
: undefined

}
);


if(r.status === 401){

salirLocal("La sesión expiró. Vuelve a entrar.");

throw new Error("Sesión expirada");

}


/*
   Algunas operaciones pueden devolver
   respuesta vacía. No intentamos convertir
   una respuesta vacía en JSON.
*/

const texto = await r.text();

let j = null;

if(texto){

try{
j = JSON.parse(texto);
}catch(e){
j = texto;
}

}


if(!r.ok){

let errorMsg = "Error HTTP " + r.status;

if(j && j.message){
errorMsg = j.message;
}

if(j && j.error){
errorMsg = j.error;
}

msg(errorMsg);

throw new Error(errorMsg);

}


return j;

}


/* =========================
   LOGIN
========================= */

async function comprobarRolAdmin(token){

const r = await fetch(

B + "/rest/v1/rpc/mi_rol",

{
method:"POST",

headers:{
apikey:C.SUPABASE_KEY,
Authorization:"Bearer " + token,
"Content-Type":"application/json"
},

body:"{}"

}

);


if(!r.ok) throw new Error("No se pudo comprobar el rol.");

const rol = await r.json();

return typeof rol === "string" ? rol : "";

}


async function abrirPanel(session){

T = session.access_token;
ME = session.user && session.user.id ? session.user.id : "";


$("lg").style.display = "none";

$("ad").style.display = "block";


/*
   IMPORTANTE:
   Aquí NO cargamos pedidos.
   Así un problema de RLS de pedidos
   no puede impedir entrar al panel.
*/

try{

await load();

}catch(e){

console.error(e);

msg("El panel abrió, pero no se pudieron cargar todos los datos.");

}

tab("p");

}


async function login(){

loginMsg("");

const email = $("em").value.trim();

const password = $("pw").value;


if(!email || !password){

loginMsg("Escribe el correo y la contraseña.");

return;

}


if(!window.VXAUTH){

loginMsg("No se pudo cargar el sistema de cuentas.");

return;

}


try{

const session = await VXAUTH.signIn(email, password);

if(!session || !session.access_token){

loginMsg("No se pudo iniciar sesión.");

return;

}


const rol = await comprobarRolAdmin(session.access_token);


if(rol !== "admin"){

T = "";
ME = "";

loginMsg("Esta cuenta no tiene acceso al panel.");

return;

}


await abrirPanel(session);

}catch(e){

console.error(e);

loginMsg(
e && e.message ?
e.message :
"No se pudo iniciar sesión."
);

}

}


async function initAdmin(){

if(!window.VXAUTH){

loginMsg("No se pudo cargar el sistema de cuentas.");

return;

}


try{

const session = await VXAUTH.getSession();

if(!session){

loginMsg("");

return;

}


const rol = await comprobarRolAdmin(session.access_token);


if(rol !== "admin"){

loginMsg("Esta cuenta no tiene acceso al panel.");

return;

}


await abrirPanel(session);

}catch(e){

console.error(e);

T = "";
ME = "";

$("lg").style.display = "block";
$("ad").style.display = "none";

loginMsg("La sesión no es válida. Vuelve a entrar.");

}

}


/* =========================
   CARGA PRINCIPAL
========================= */

async function load(){

K = await api(
"categorias?order=orden"
);

P = await api(
"productos?order=created_at.desc"
);

O = await api(
"ofertas?order=created_at.desc"
);


/*
   NO cargar pedidos aquí.
   Se cargan únicamente al entrar
   en la pestaña PEDIDOS.
*/

}


async function cargarUsuarios(){

U = await api(
"rpc/admin_listar_usuarios",
"POST",
{}
);

if(!Array.isArray(U)) U = [];

UL = true;

return U;

}


function usuarioRol(u){

return u && u.role ? u.role : "cliente";

}


async function gestores(){

$("v").innerHTML =
'<h3>Promotores</h3>'+
'<p>Asigna el rol comercial. Las cuentas actuales y las nuevas cuentas promotoras son equivalentes.</p>'+
'<p>El modo de precio y la comisión fija se configuran por producto en la pestaña Productos. El máximo de subida es 20 %.</p>'+
'<div class="r">Cargando usuarios...</div>';

try{

await cargarUsuarios();

if(!U.length){

$("v").innerHTML =
'<h3>Promotores</h3>'+
'<div class="r">No hay usuarios registrados.</div>';

return;

}

$("v").innerHTML =
'<h3>Promotores</h3>'+
'<p>El porcentaje actual se aplica a los pedidos nuevos que asignes. La comisión por producto se configura en la pestaña Productos.</p>'+
U.map(u => {

const rol = usuarioRol(u);
const porcentaje = u.comision_porcentaje == null ? "" : u.comision_porcentaje;

if(rol === "admin"){

return '<div class="r">'+
'<strong>'+esc(u.email)+'</strong><br>'+
'<small>Cuenta administradora</small>'+
'</div>';

}

return '<div class="r">'+
'<strong>'+esc(u.email)+'</strong><br>'+
'<small>Rol actual: '+esc(rol === "gestor" || rol === "promotor" ? "Promotor" : rol)+' · Comisión: '+esc(porcentaje === "" ? "0" : porcentaje)+'%</small><br><br>'+
'<select id="gr-'+esc(u.user_id)+'">'+
'<option value="cliente"'+(rol === "cliente" ? " selected" : "")+'>Cliente</option>'+
'<option value="gestor"'+(rol === "gestor" ? " selected" : "")+'>Promotor · cuenta existente</option>'+
'<option value="promotor"'+(rol === "promotor" ? " selected" : "")+'>Promotor · cuenta nueva</option>'+
'</select>'+
'<input id="gp-'+esc(u.user_id)+'" type="number" min="0" max="100" step="0.01" placeholder="Comisión %" value="'+esc(porcentaje)+'">'+
'<button onclick="guardarPromotor(\''+esc(u.user_id)+'\')">GUARDAR</button>'+
'</div>';

}).join("");

}catch(e){

$("v").innerHTML =
'<h3>Promotores</h3>'+
'<div class="r"><strong>No se pudieron cargar los usuarios.</strong><br><small>'+esc(e.message || "")+'</small></div>';

}

}


async function guardarPromotor(userId){

const select = $("gr-"+userId);
const input = $("gp-"+userId);

if(!select || !input) return;

const rol = select.value;
const porcentaje = Number(input.value);

if(!Number.isFinite(porcentaje) || porcentaje < 0 || porcentaje > 100){

msg("La comisión debe estar entre 0 y 100.");

return;

}

if(userId === ME){

msg("No puedes cambiar tu propia cuenta.");

return;

}

try{

await api(
"rpc/admin_guardar_promotor",
"POST",
{
p_user_id:userId,
p_rol:rol,
p_comision_porcentaje:porcentaje,
p_activo:true
}
);

await cargarUsuarios();
await gestores();
msg("Usuario actualizado correctamente.", true);

}catch(e){

msg(e.message || "No se pudo actualizar el usuario.");

}

}


/* =========================
   COMISIONES
========================= */

const COMISION_ESTADOS = {
pendiente:"Pendiente",
disponible:"Lista para cobrar",
pagada:"Pagada",
cancelada:"Cancelada"
};

function comisionLabel(estado){
return COMISION_ESTADOS[estado] || "Pendiente";
}

function comisionBadge(estado){
if(estado === "disponible") return "gold";
if(estado === "cancelada") return "off";
if(estado === "pagada") return "on";
return "";
}

function promotorEmail(promotorId){
const usuario = U.find(u => u.user_id === promotorId);
return usuario ? usuario.email : "Promotor sin identificar";
}

function adminMoney(value){
if(value === null || value === undefined || value === "") return "—";
const amount = Number(value);
return Number.isFinite(amount) ? "$" + amount.toFixed(2) : "—";
}

function pedidoGestor(o){
if(!o) return "";
return o.gestor_nombre || o.gestor_telefono || (o.promotor_id ? promotorEmail(o.promotor_id) : "");
}

async function comisiones(){

CM = [];

$("v").innerHTML =
'<h3>Comisiones</h3>'+
'<p>Cargando comisiones...</p>';

try{

CM = await api(
"pedidos?promotor_id=not.is.null&order=created_at.desc"
);

if(!Array.isArray(CM)) CM = [];

try{
await cargarUsuarios();
}catch(e){
UL = false;
}

$("v").innerHTML =
'<h3>Comisiones</h3>'+
'<p>Registro de comisiones atribuidas. Solo administración puede marcar un pago como realizado.</p>'+
'<div class="cm-tools">'+
'<input id="cms" placeholder="Buscar por pedido, cliente o promotor" oninput="renderComisiones()">'+
'<select id="cmf" onchange="renderComisiones()">'+

function renderComisiones(){

const lista = $("cml");

if(!lista) return;

const filtro = $("cmf") ? $("cmf").value : "";
const texto = $("cms") ? $("cms").value.trim().toLowerCase() : "";

const visibles = CM.filter(o => {

const estado = o.comision_estado || "pendiente";

if(filtro && estado !== filtro) return false;
if(!texto) return true;

return [
o.codigo,
o.nombre_cliente,
o.email,
o.telefono,
promotorEmail(o.promotor_id)
].some(x => String(x || "").toLowerCase().includes(texto));

});

if(!visibles.length){

lista.innerHTML =
'<div class="r">No hay comisiones con ese filtro.</div>';

return;

}

lista.innerHTML = visibles.map(o => {

const estado = o.comision_estado || "pendiente";
const pagada = estado === "pagada";
const cancelada = estado === "cancelada";
const disponible = estado === "disponible";
const monto = Number(o.comision_monto_usd || 0).toFixed(2);
const porcentaje = o.comision_porcentaje == null ? "0" : o.comision_porcentaje;

const motivo = cancelada
? (o.cancelado_por_cliente
? 'Pedido cancelado por el cliente'
: 'Pedido cancelado')
: '';

const fechas = [];

if(o.comision_disponible_at) fechas.push("Disponible: "+new Date(o.comision_disponible_at).toLocaleString("es-ES"));
if(o.comision_pagada_at) fechas.push("Pagada: "+new Date(o.comision_pagada_at).toLocaleString("es-ES"));

return '<div class="r">'+
'<div class="op-row-head"><strong>'+esc(o.codigo)+'</strong>'+
'<span class="op-badge '+comisionBadge(estado)+'">'+esc(comisionLabel(estado))+'</span></div>'+
'<span class="cm-meta">Cliente: '+esc(o.nombre_cliente || "Sin nombre")+'</span>'+

'<span class="cm-meta">Pedido: $'+Number(o.total_usd || 0).toFixed(2)+' · Comisión: $'+monto+' ('+esc(porcentaje)+'%)</span>'+
(motivo ? '<span class="cm-meta">Motivo: '+esc(motivo)+'</span>' : '')+
(fechas.length ? '<span class="cm-meta">'+fechas.map(esc).join(' · ')+'</span>' : '')+
(disponible

: '')+

const pct = porcentaje.value.trim();
const manual = monto.value.trim();

if(pct !== "" && (!Number.isFinite(Number(pct)) || Number(pct) < 0 || Number(pct) > 100)){

msg("La comisión debe estar entre 0 y 100.");

return;

}

if(manual !== "" && (!Number.isFinite(Number(manual)) || Number(manual) < 0)){

msg("El monto de la comisión no puede ser negativo.");

return;

}

try{

await api(
"rpc/admin_asignar_promotor",
"POST",
{
p_pedido_id:id,
p_promotor_id:select.value || null,
p_comision_porcentaje:pct === "" ? null : Number(pct),
p_comision_monto_usd:manual === "" ? null : Number(manual)
}
);

await pedidos();
await verPedido(id);
msg("Pedido actualizado correctamente.", true);

}catch(e){

msg(e.message || "No se pudo asignar el pedido.");

}

}

async function saveP(){

const n =
$("n").value.trim();


if(!n || !$("pr").value){

msg(
"Falta nombre o precio"
);

return;

}


const shippingType =
$("st").value === "paid" ?
"paid" :
"free";

let shippingCost = null;


if(shippingType === "paid"){

const raw =
$("sc").value.trim();


if(raw){

const cost = Number(raw);

if(isFinite(cost) && cost > 0){

const rounded =
Math.round(cost * 100) / 100;

if(rounded > 0) shippingCost = rounded;

}

}

}


let priceMode =
$("pm").value === "sin_comision" ?
"sin_comision" :
"comision_fija";


let fixedCommission = null;


if(priceMode === "comision_fija"){

const raw =
$("pcf").value.trim();


if(raw){

const amount = Number(raw);

if(!isFinite(amount) || amount < 0){

msg("La comisión fija no es válida");

return;

}

fixedCommission =
Math.round(amount * 100) / 100;

}
else{

priceMode = "sin_comision";

}

}


const fs =
[...$("f").files];


for(let i=0;i<fs.length;i++){

const f = fs[i];


msg(
"Subiendo foto "+
(i+1)+
" de "+
fs.length+
"..."
);


const nm =

Date.now()+
"-"+
i+
"-"+
f.name.replace(
/[^a-z0-9.]/gi,
"_"
);


const r = await fetch(

B+
"/storage/v1/object/productos/"+
nm,

{
method:"POST",

headers:{
apikey:C.SUPABASE_KEY,
Authorization:"Bearer "+T,
"Content-Type":f.type
},

body:f

}

);


if(!r.ok){

msg(
"Error subiendo la foto "+
(i+1)
);

return;

}


IM.push(

B+
"/storage/v1/object/public/productos/"+
nm

);

}


const b = {

nombre:n,

categoria_id:
$("k").value || null,

precio_usd:
+$("pr").value,

modo_precio:
priceMode,

comision_fija_usd:
fixedCommission,

disponibilidad:
$("d").value,

garantia:
$("g").value,

transporte:
$("tr").value,

shipping_type:
shippingType,

shipping_cost:
shippingCost,

descripcion:
$("de").value,

caracteristicas:
$("ca").value
.split("\n")
.map(s => s.trim())
.filter(Boolean),

imagen_principal:
IM[0] || null,

imagenes:
IM,

activo:
$("ac").checked,

updated_at:
new Date().toISOString()

};


try{


if(E){

await api(
"productos?id=eq."+
encodeURIComponent(E),

"PATCH",

b

);

}else{

b.slug =
slug(n);

await api(
"productos",
"POST",
b
);

}


await load();

tab("p");

msg(
"Guardado correctamente"
);


}catch(e){

msg(
"No se pudo guardar el producto."
);

}

}

const whatsapp = opDigits($("opw").value);
const horario = $("oph").value.trim();
const disponible = $("opd").checked;
const activa = $("opa").checked;
const orden = Number($("opo").value) || 0;
const form = $("opForm");
const btn = form ? form.querySelector('button[type="submit"]') : null;

if(!nombre){
msg("Escriba el nombre de la operadora.");
$("opn").focus();
return;
}

if(whatsapp.length < 8 || whatsapp.length > 15){
msg("Escriba el WhatsApp con código de país, solo números.");
$("opw").focus();
return;
}

const b = {
nombre: nombre,
whatsapp: whatsapp,
horario: horario,
disponible: disponible,
activa: activa,
orden: orden
};

if(btn){
btn.disabled = true;
btn.textContent = "Guardando...";
}

try{
if(OPEDIT){
await api("operadoras?id=eq."+encodeURIComponent(OPEDIT), "PATCH", b);
}else{
await api("operadoras", "POST", b);
}
OPEDIT = null;
await opsCargar();
msg("Operadora guardada correctamente.", true);
}catch(err){
msg("No se pudo guardar la operadora. " + (err.message || ""));
if(btn){
btn.disabled = false;
btn.textContent = OPEDIT ? "Guardar cambios" : "Crear operadora";
}
}
}

function opEdit(id){
OPEDIT = id;
renderOpsAdmin();
msg("");
const f = $("opn");
if(f){
f.scrollIntoView({behavior: "smooth", block: "center"});
f.focus();
}
}

function opReset(){
OPEDIT = null;
renderOpsAdmin();
msg("");
}

async function opToggle(id){
const o = OP.find(x => x.id === id);
if(!o)return;
try{
await api("operadoras?id=eq."+encodeURIComponent(id), "PATCH", {activa: !o.activa});
await opsCargar();
msg(o.activa ? "Operadora desactivada." : "Operadora activada.", true);
}catch(e){
msg("No se pudo cambiar el estado de la operadora.");
}
}

async function opDelete(id){
const o = OP.find(x => x.id === id);
if(!o)return;

await askDeleteCon(
"¿Eliminar la operadora "+o.nombre+"? Esta acción no se puede deshacer.",
"Eliminar operadora",
async () => {
try{
await api("operadoras?id=eq."+encodeURIComponent(id), "DELETE");
OP = OP.filter(x => x.id !== id);
if(OPEDIT === id) OPEDIT = null;
renderOpsAdmin();
msg("Operadora eliminada correctamente.", true);
}catch(e){
alert("No se pudo eliminar la operadora. " + (e.message || ""));
throw e;
}
}
);

}

initAdmin();

</script>
</body>
</html>
