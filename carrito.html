<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Su pedido - Volxen</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="volxen-tailwind.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Inter+Tight:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link rel="stylesheet" href="volxen.css">
</head>

<body class="h-full bg-bg text-fg flex flex-col font-sans antialiased selection:bg-g selection:text-white" data-page="carrito">

    <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-s2 border border-bd rounded-2xl shadow-sm p-6">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold text-fg">Su pedido</h1>
                <span id="bd" class="bg-fg text-g text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center">0</span>
            </div>
            <div id="cl"></div>
            <div class="tt" id="tt"></div>
            <p class="nt mt-4">Los precios son estimados. Su asesor confirma el precio final, la disponibilidad y las condiciones antes de cerrar el pedido.</p>

            <!-- Trust indicators -->
            <div class="mt-6 pt-4 border-t border-bd flex flex-wrap gap-4 text-sm text-mu" aria-label="Garantías">
                <div class="flex items-center gap-2"><i class="fa-solid fa-shield-halved text-g"></i><span>Garantía por escrito</span></div>
                <div class="flex items-center gap-2"><i class="fa-solid fa-truck-fast text-g"></i><span>Entrega en La Habana</span></div>
                <div class="flex items-center gap-2"><i class="fa-solid fa-headset text-g"></i><span>Asesor personal</span></div>
                <div class="flex items-center gap-2"><i class="fa-solid fa-lock text-g"></i><span>Pago contra entrega</span></div>
            </div>

            <a id="cartGo" class="btn-primary mt-6 block text-center py-3" href="checkout.html" style="display:none">Continuar con el pedido</a>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="volxen-core.js"></script>
    <script>
        (function () {
            VX.start(function () { VX.cart(); });
        })();
    </script>
</body>
</html>
