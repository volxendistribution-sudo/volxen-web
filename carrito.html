<!DOCTYPE html>
<html lang="es" class="h-full">
<head>

    <title>Su pedido - Volxen</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="volxen-tailwind.js"></script>

    <link

            <h1 style="margin-top:0">Su pedido</h1>
            <div id="cl"></div>
            <div class="tt" id="tt"></div>
            <p class="nt" style="margin-top:1rem">Los precios son estimados. Su asesor confirma el precio final, la disponibilidad y las condiciones antes de cerrar el pedido.</p>
            <a id="cartGo" class="bt" style="display:none;width:100%;margin-top:1.5rem;text-align:center;padding:16px 12px" href="checkout.html">Continuar con el pedido</a>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="volxen-core.js"></script>
    <script>
        (function () {
            VX.start(function () { VX.cart(); });
        })();
