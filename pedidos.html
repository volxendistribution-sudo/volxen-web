<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rastree sus pedidos en VOLXEN. Consulte el estado, historial y detalles de sus compras. Ingrese su código de pedido y seguimiento.">
    <meta name="theme-color" content="#1F4036">
    <meta property="og:title" content="Mis Pedidos - VOLXEN">
    <meta property="og:description" content="Rastree sus pedidos en VOLXEN. Consulte estado, historial y detalles de sus compras.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://volxen.com/pedidos.html">
    <meta property="og:image" content="https://volxen.com/logo-light.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Mis Pedidos - VOLXEN">
    <meta name="twitter:description" content="Rastree sus pedidos en VOLXEN.">
    <link rel="canonical" href="https://volxen.com/pedidos.html">

    <!-- Font Preloads -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="dist/fonts/DM-Sans-Regular.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="dist/fonts/DM-Sans-Medium.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="dist/fonts/DM-Sans-SemiBold.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="dist/fonts/DM-Sans-Bold.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="dist/fonts/InterTight-Regular.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="dist/fonts/InterTight-Medium.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="dist/fonts/InterTight-SemiBold.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="dist/fonts/InterTight-Light.woff2">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">

    <link rel="stylesheet" href="dist/volxen.css">
</head>

<body class="h-full bg-bg text-fg flex flex-col font-sans antialiased selection:bg-g selection:text-fg" data-page="pedidos" data-shell="minimal">

    <a href="#main" class="skip-link">Saltar al contenido principal</a>

    <main id="main" class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <section id="trackCard" class="form-card">
            <h1>Mis pedidos</h1>
            <p class="form-intro">Consulte el estado de su pedido con el código que recibió al confirmar su compra y su código de seguimiento.</p>
            <form id="trackForm" novalidate>
                <div class="field">
                    <label for="tc">Código del pedido</label>
                    <input id="tc" name="codigo" class="input-base" type="text" placeholder="VX-2026-000001" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
                </div>
                <div class="field">
                    <label for="tt">Código de seguimiento</label>
                    <input id="tt" name="seguimiento" class="input-base" type="text" placeholder="Escriba su código de seguimiento" autocomplete="off" spellcheck="false" required>
                </div>
                <p id="te" class="form-error" role="alert"></p>
                <div class="form-actions">
                    <a href="index.html" class="btn-secondary">Cancelar</a>
                    <button type="submit" id="tsub" class="btn-primary">Consultar pedido</button>
                </div>
            </form>
        </section>

        <section id="trackResult" class="form-card hidden" aria-live="polite">
            <div id="pv"></div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="volxen-core.js"></script>
    <script type="module" src="dist/main.min.js"></script>
</body>
</html>
