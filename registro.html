<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Crear cuenta · VOLXEN</title>
</head>
<body>
    <noscript><p>Activa JavaScript o <a href="login.html?modo=registro">continúa a la creación de cuenta</a>.</p></noscript>
    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            params.set("modo", "registro");
            location.replace("login.html?" + params.toString());
        })();
    </script>
</body>
</html>
