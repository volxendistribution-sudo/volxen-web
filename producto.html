<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ver detalles del producto en VOLXEN. Tecnología y energía en Cuba. Precio, características, garantía, transporte y disponibilidad.">
    <meta name="theme-color" content="#C8A165">
    <meta property="og:title" content="Producto - VOLXEN">
    <meta property="og:description" content="Ver detalles del producto en VOLXEN. Tecnología y energía en Cuba.">
    <meta property="og:type" content="product">
    <meta property="og:url" content="https://volxen.com/producto.html">
    <meta property="og:image" content="https://volxen.com/logo-light.svg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Producto - VOLXEN">
    <meta name="twitter:description" content="Ver detalles del producto en VOLXEN. Tecnología y energía en Cuba.">
    <link rel="canonical" href="https://volxen.com/producto.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Inter+Tight:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Inter+Tight:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="volxen-tailwind.js"></script>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">

    <link rel="stylesheet" href="volxen.css">
</head>

<body class="h-full bg-bg text-fg flex flex-col font-sans antialiased selection:bg-g selection:text-white" data-page="producto">

    <a href="#main" class="skip-link">Saltar al contenido principal</a>

    <main id="main" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <a href="catalogo.html" class="lb btn-ghost inline-flex items-center gap-2" style="min-height:44px">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Volver al catálogo
        </a>
        <div id="prod" class="mt-6"></div>
    </main>

    <script src="config.js"></script>
    <script src="volxen-core.js"></script>
    <script>
        (function () {
            VX.start(function () {
                var host = VX.$("prod");
                var id = new URLSearchParams(location.search).get("id") || "";
                var P = VX.getP();
                var p = P.find(function (x) { return String(x.id) === String(id); });
                if (!p) {
                    host.innerHTML = '<div class="bg-s2 border border-bd rounded-2xl shadow-sm p-8 max-w-md mx-auto text-center"><h3 class="text-xl font-bold text-fg mb-2">Producto no disponible</h3><p class="text-mu mb-4">No encontramos esta pieza. Puede que ya no esté publicada.</p><a class="btn-primary inline-block" href="catalogo.html">Ver el catálogo</a></div>';
                    return;
                }
                var ims = VX.ft(p), mq = 1;
                var f = (p.caracteristicas || []).map(function (x) { return "<li>" + VX.esc(x) + "</li>"; }).join("");
                var agotado = VX.ag(p);

                function render() {
                    var priceHtml = VX.price(p);
                    var categoryBadge = '<span class="ey">' + VX.esc(VX.cn(p.categoria_id)) + '</span>';
                    var titleHtml = '<h1 class="text-2xl sm:text-3xl font-bold text-fg mt-2 mb-4">' + VX.esc(p.nombre) + '</h1>';
                    var priceDisplay = '<div class="pc text-2xl font-bold text-fg">' + priceHtml + '</div>';
                    var descHtml = p.descripcion ? '<p class="text-mu leading-relaxed mt-4">' + VX.esc(p.descripcion) + '</p>' : '';
                    var specsHtml = f ? '<ul class="list-disc pl-5 space-y-2 text-mu mt-4">' + f + '</ul>' : '';
                    var garantiaHtml = p.garantia ? '<p class="mt-3"><span class="text-fg font-medium">Garantía:</span> ' + VX.esc(p.garantia) + '</p>' : '';
                    var transporteHtml = p.transporte ? '<p class="mt-1"><span class="text-fg font-medium">Transporte:</span> ' + VX.esc(p.transporte) + '</p>' : '';

                    var galleryHtml = '';
                    if (ims[0]) {
                        galleryHtml +=
                            '<div class="product-gallery">' +
                            '<div class="main-image-container" style="border:1px solid var(--bd);background:var(--sf);aspect-ratio:1/1;border-radius:var(--radius-xl);overflow:hidden;display:grid;place-items:center;">' +
                            '<img class="zoomable" id="pimg" src="' + VX.esc(ims[0]) + '" alt="' + VX.esc(p.nombre) + '" style="max-width:100%;max-height:100%;object-fit:contain;padding:var(--space-4);cursor:zoom-in">' +
                            '</div>';
                        if (ims.length > 1) {
                            galleryHtml += '<div class="thumbnails" style="display:flex;gap:var(--space-2);margin-top:var(--space-3);overflow-x:auto">';
                            ims.forEach(function(u) {
                                galleryHtml += '<img data-th="' + VX.esc(u) + '" src="' + VX.esc(u) + '" alt="" class="thumb-img" style="width:72px;height:72px;object-fit:cover;background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius-md);cursor:pointer;flex:none;transition:border-color .2s,transform .2s;">';
                            });
                            galleryHtml += '</div>';
                        }
                        galleryHtml += '</div>';
                    }

                    var actionHtml = agotado
                        ? '<p class="badge-out-of-stock inline-block mt-6 px-4 py-2 rounded-lg">Agotado</p>' +
                          '<a class="btn-secondary block text-center mt-4 py-3" href="' + VX.wa('Buenas, deseo consultar por la pieza "' + p.nombre + '" (' + VX.fm(VX.pr(p)) + ').') + '" target="_blank" rel="noopener">Consultar disponibilidad</a>'
                        : '<div class="mt-6 flex items-center gap-3">' +
                          '<div class="q">' +
                          '<button data-pq="-1" aria-label="Menos cantidad" class="qty-btn">−</button>' +
                          '<i id="pmq" style="min-width:28px;text-align:center;font-style:normal;color:var(--fg)">' + mq + '</i>' +
                          '<button data-pq="1" aria-label="Más cantidad" class="qty-btn">+</button>' +
                          '</div>' +
                          '</div>' +
                          '<div class="mt-4 flex gap-3">' +
                          '<button class="btn-secondary flex-1 py-3" data-padd>Añadir al carrito</button>' +
                          '<button class="btn-primary flex-1 py-3" data-pbuy>Comprar</button>' +
                          '</div>';

                    var waLink = '<a class="sl btn-ghost inline-block mt-6" target="_blank" rel="noopener" href="' + VX.wa('Buenas, deseo consultar por la pieza "' + p.nombre + '" (' + VX.fm(VX.pr(p)) + ').') + '">O consultar solo esta pieza con su asesor</a>';

                    host.innerHTML =
                        '<div class="grid md:grid-cols-2 gap-8 lg:gap-12 items-start">' +
                        '<div>' + galleryHtml + '</div>' +
                        '<div>' +
                        categoryBadge + titleHtml + priceDisplay + descHtml + specsHtml + garantiaHtml + transporteHtml +
                        actionHtml + waLink +
                        '</div></div>';

                    // Inyectar JSON-LD Product
                    injectProductJsonLd(p, ims[0]);
                }
                render();

                host.addEventListener("click", function (e) {
                    var th = e.target.closest("[data-th]");
                    if (th) { var im = VX.$("pimg"); if (im) im.src = th.getAttribute("data-th"); return; }
                    var pq = e.target.closest("[data-pq]");
                    if (pq) { mq = Math.max(1, mq + Number(pq.getAttribute("data-pq"))); var mi = VX.$("pmq"); if (mi) mi.textContent = mq; return; }
                    if (e.target.closest("[data-padd]")) { VX.add(p.id, mq); return; }
                    if (e.target.closest("[data-pbuy]")) { VX.add(p.id, mq); location.href = "checkout.html"; return; }
                });
            });
        })();

        function injectProductJsonLd(product, image) {
            var script = document.createElement('script');
            script.type = 'application/ld+json';
            var price = product.precio_usd || 0;
            var offerPrice = VX.getO()[product.id] || price;
            var inStock = product.disponibilidad !== "agotado";
            var jsonLd = {
                "@context": "https://schema.org",
                "@type": "Product",
                "name": product.nombre,
                "description": product.descripcion || "Producto de tecnología y energía en VOLXEN Cuba",
                "image": image || "https://volxen.com/logo-light.svg",
                "brand": { "@type": "Brand", "name": "VOLXEN" },
                "sku": product.id,
                "offers": {
                    "@type": "Offer",
                    "url": window.location.href,
                    "priceCurrency": "USD",
                    "price": offerPrice.toFixed(2),
                    "availability": inStock ? "https://schema.org/InStock" : "https://schema.org/OutOfStock",
                    "seller": { "@type": "Organization", "name": "VOLXEN Comercializadora Cuba" }
                }
            };
            if (product.garantia) jsonLd.warranty = product.garantia;
            script.textContent = JSON.stringify(jsonLd);
            document.head.appendChild(script);
        }
    </script>
</body>
</html>
